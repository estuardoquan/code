services:
    server:
        image: lscr.io/linuxserver/wireguard:latest
        environment:
            PUID: $WG_SERVER_PUID
            PGID: $WG_SERVER_PGID
            TZ: $WG_SERVER_TZ
            SERVERURL: $WG_SERVER_SERVERURL
            SERVERPORT: $WG_SERVER_SERVERPORT
            PEERS: $WG_SERVER_PEERS
            PEERDNS: $WG_SERVER_PEERDNS
            INTERNAL_SUBNET: $WG_SERVER_INTERNAL_SUBNET
            ALLOWEDIPS: $WG_SERVER_ALLOWEDIPS
            PERSISTENTKEEPALIVE_PEERS: $WG_SERVER_PERSISTENTKEEPALIVE_PEERS
            LOG_CONFS: $WG_SERVER_LOG_CONFS
        sysctls:
            - net.ipv4.ip_forward=1
            - net.ipv4.conf.all.src_valid_mark=1
        cap_add:
            - NET_ADMIN
            - SYS_MODULE

